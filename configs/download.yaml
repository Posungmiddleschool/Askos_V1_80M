# Notebook 01 (D1a) downloader settings. Source list and shares are in data/sources.yaml (spec §5.1);
# this file holds how they are fetched. Every value here is recorded in reports/D1.md.

overshoot: 1.6                  # spec §5.2: target = (read_gb + l3_gb) x 1.6, bytes = UTF-8 text bytes
part_flush_mb: 256              # one output part per <= 256 MB of text (atomic write + state save)
prefetch_files: 4               # HF files downloaded ahead of the parser, per source
max_doc_errors: 30              # per sub-source; above this the sub-source is marked failed (guide: fail tolerance)

http:
  user_agent: "askos-data-research/1.0 (pretraining dataset build; respects robots.txt)"
  min_interval_s: 1.0           # per host, between requests
  per_host_interval_s:          # static bulk hosts where one request per second would take hours
    www.rfc-editor.org: 0.25    # 8,873 RFC text files when rsync is refused (2026-11-11: refused from the test host)
  retries: 5
  backoff_s: 4.0
  timeout_s: 120

hf:
  revision_pin: true            # resolve each dataset to its current commit sha once, record it, read only that sha
  files:                        # file globs where the dataset card has no usable `configs:` entry
    allenai/peS2o: "data/v2/train-*.json.gz"            # README: "peS2o V2 (Latest)"
    EleutherAI/proof-pile-2/algebraic-stack: "algebraic-stack/train/*.jsonl.zst"
    mlfoundations/dclm-baseline-1.0: "global-shard_*/local-shard_*/*.jsonl.zst"
    open-index/hacker-news: "data/*/*.parquet"          # monthly archive only (not the live "today/" blocks)
    common-pile/stackv2_edu_filtered: "*.json.gz"
    common-pile/arxiv_papers_filtered: "*.json.gz"
    common-pile/doab_filtered: "*.json.gz"
    common-pile/libretexts_filtered: "*.json.gz"
    common-pile/pressbooks_filtered: "*.json.gz"
    common-pile/oercommons_filtered: "*.json.gz"
    common-pile/github_archive_filtered: "*.json.gz"
    common-pile/python_enhancement_proposals_filtered: "*.json.gz"
    heegyu/namuwiki-extracted: "*.parquet"
  shuffle_files:                # seeded permutation of the frozen file list (repos whose files are grouped)
    common-pile/stackv2_edu_filtered: 1234   # files are grouped by language; read a mix
    common-pile/github_archive_filtered: 1234
    HuggingFaceFW/finepdfs-edu: 1234

filters:
  fineweb_edu_min_int_score: 4
  fineweb2_min_language_score: 0.9
  dclm_top_frac: 0.10           # "top 10% by the dataset's fastText quality score"
  dclm_score_field: fasttext_openhermes_reddit_eli5_vs_rw_v2_bigram_200k_train_prob
  dclm_calibration_files: 4     # threshold = (1 - top_frac) quantile over the first N files, frozen in state
  code_keep_frac: 0.5           # "top half by a public Stack-Edu classifier" (spec §5.1), on the released score
  code_calibration_files: 6     # threshold = median score over the first 6 files of the shuffled list (several languages)
  korean_webtext_edu_min_score: 3.0   # the dataset's own release threshold (kept explicit)
  stackexchange_min_answer_score: 5
  hn_min_story_score: 100

stackexchange:
  archive_item: stackexchange   # archive.org/details/stackexchange; md5 from archive.org/metadata

papers_books:
  wikibooks: [enwikibooks, kowikibooks]

geek_debate:
  hn_comment_window_months: 3  # comments of a story are collected from its month and the next 2 (HN threads go quiet in weeks)
  convokit_url: "https://zissou.infosci.cornell.edu/convokit/datasets/winning-args-corpus/winning-args-corpus.zip"

hacker_docs:
  rfc_rsync: "rsync.rfc-editor.org::rfcs-text-only"
  rfc_index: "https://www.rfc-editor.org/rfc-index.txt"
  rfc_http: "https://www.rfc-editor.org/rfc/rfc{n}.txt"
  manpages_dir: "https://mirrors.edge.kernel.org/pub/linux/docs/man-pages/"
  jargon_dir: "http://www.catb.org/jargon/oldversions/"

rebel_classics:
  gutenberg_catalog: "https://www.gutenberg.org/cache/epub/feeds/pg_catalog.csv"
  gutenberg_text: "https://www.gutenberg.org/cache/epub/{id}/pg{id}.txt"
  gutenberg_authors:            # spec surnames -> Gutenberg catalog author prefixes (verify)
    Twain: ["Twain, Mark"]
    Swift: ["Swift, Jonathan"]
    Wilde: ["Wilde, Oscar"]
    Bierce: ["Bierce, Ambrose"]
    Paine: ["Paine, Thomas"]
    Thoreau: ["Thoreau, Henry David"]
    Carroll: ["Carroll, Lewis"]
    Conan Doyle: ["Doyle, Arthur Conan"]
    Verne: ["Verne, Jules"]
    Wells: ["Wells, H. G."]
    Voltaire: ["Voltaire"]
    Galileo: ["Galilei, Galileo"]
    Abbott: ["Abbott, Edwin Abbott"]   # catalog: "Abbott, Edwin Abbott, 1838-1926" (Flatland)
  kowikisource_authors: [이상, 채만식, 김유정]
