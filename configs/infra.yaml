# Infrastructure settings (Modal, Hugging Face, setup probes). Not model hyperparameters.
# The names under `modal:` must match the constants at the top of modal_app.py (tests/test_infra.py checks).

modal:
  app: askos-v1-80m
  volume: askos-data              # re-creatable data only (raw, clean, bins, L3 index, anchors). NOTES.md D-01
  hf_secret: huggingface          # created by a human: modal secret create huggingface HF_TOKEN=...
  gpus:                           # which Modal GPU each stage uses (NOTES.md D-02)
    setup_probe: [L4, L40S, H100]
    cursor_kernel: L4             # notebook 04
    saegim: L40S                  # notebook 05
    smoke: L4                     # notebook 06
    ref_model: L4                 # notebook 07
    main: H100                    # notebooks 08, 09, 10

hub:
  # Shared HF namespace for every Modal account of the project (NOTES.md D-23): ONE HF account that all
  # Modal accounts write to. Each person puts a token of this same HF account into their own Modal secret.
  # Env ASKOS_HF_NAMESPACE overrides it.
  namespace: AskosAILabs
  state_repo: askos-v1-80m-state  # private model repo: locks/, logs, reports, checkpoints
  data_repo: askos-v1-80m-data    # private dataset repo: stage artifacts (raw/<source>/..., later bins)
  log_upload_every_min: 30
  heartbeat_every_min: 10         # also how fast a taken-over container notices and stops
  lock_stale_hours: 30            # a running lock without a heartbeat for this long may be taken over
  push_every_min: 20              # artifacts are pushed to the data repo this often and at the end; when an
                                  # account's credits run out, the next account loses at most this much work

probe:
  volume_write_mb: 512
  hf_read_mb: 256
  hf_public_glob: datasets/HuggingFaceFW/fineweb-edu/sample/10BT/*.parquet
  matmul_n: 8192
  matmul_iters: 20
  flash_doc_lens: [300, 1000, 724]
  flash_heads: 12
  flash_head_dim: 64
  flash_tol: 0.02
  hbm_target_gb: {H100: 75}       # spec §12: HBM <= 75 GB in the main run
  http_timeout_s: 20
  hosts:                          # non-HF sources of data/sources.yaml (warning only)
    - https://archive.org/details/stackexchange
    - https://www.rfc-editor.org/
    - https://www.gutenberg.org/
    - https://dumps.wikimedia.org/
    - https://mirrors.edge.kernel.org/pub/linux/docs/man-pages/
    - http://www.catb.org/jargon/         # catb.org has no HTTPS; notebook 01 verifies the tarball checksum
    - https://zissou.infosci.cornell.edu/convokit/
